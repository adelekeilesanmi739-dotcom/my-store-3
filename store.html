<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store | MyStore</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav>
        <div class="nav-logo">
            MyStore
        </div>
        <a href="index.html" class="back-home">← Back to Home</a>
    </nav>

    <!-- Store Section -->
    <section id="store" class="auth-section">

        <div id="storeLoading">
            <p>Loading store...</p>
        </div>

        <div id="storeNotFound" style="display: none;">
            <h2>Store Not Found</h2>
            <p class="section-description">
                We couldn't find a store at this link. It may not exist,
                or the owner hasn't published it yet.
            </p>
        </div>

               <div id="storeContent" style="display: none;">
            <p class="section-label" id="storeProductType"></p>
            <h2 id="storeBusinessName"></h2>
            <p class="section-description" id="storeBusinessDescription"></p>

            <div id="storeProducts"></div>
        </div>
    </section>

    <!-- Supabase library + our connection file -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="store.js"></script>
</body>

</html>
